services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      PORT: "8080"
      INFERENCE_URL: http://inference:9000
    ports:
      - "8080:8080" # host access for the Vite dev server's /ws proxy
    depends_on:
      inference:
        condition: service_healthy # model loaded; sessions die without it

  inference:
    build: ./inference
    environment:
      DENOISE: "1"
    expose:
      - "9000"
    volumes:
      - hf-cache:/root/.cache/huggingface
      # Training assets (SAA dataset, accent-classifier checkpoint). The
      # /classify-accent endpoint is disabled when no checkpoint exists here.
      - ./inference/training:/training
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 60 # model load takes ~1 min; keep checking for 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
