services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      PORT: "8080"
      INFERENCE_URL: http://inference:9000
    expose:
      - "8080"
    depends_on:
      - inference

  inference:
    build: ./inference
    environment:
      DENOISE: "1"
    expose:
      - "9000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
